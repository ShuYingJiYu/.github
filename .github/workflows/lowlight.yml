# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
    # Schedule updates (each 8 hours)
    schedule: [{ cron: "0 */8 * * *" }]
    # Lines below let you run workflow manually and on each commit
    workflow_dispatch:
    push: { branches: ["main"] }

jobs:
    github-metrics:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: lowlighter/metrics@v3.34
              with:
                  token: ${{ secrets.METRICS_TOKEN }}

                  # Options
                  user: ShuYingJiYu
                  template: classic
                  base: header, activity, community, repositories, metadata
                  base_hireable: yes
                  config_octicon: yes
                  config_timezone: Asia/Shanghai

                  plugin_languages: yes
                  plugin_languages_analysis_timeout: 15
                  plugin_languages_analysis_timeout_repositories: 10
                  plugin_languages_categories: markup, programming
                  plugin_languages_colors: github
                  plugin_languages_ignored: Mathematica, Jupyter Notebook, Starlark, BibTeX Style, Tex, Shell
                  plugin_languages_limit: 10
                  plugin_languages_sections: most-used
                  plugin_languages_threshold: 0%

                  plugin_traffic: yes

                  plugin_people: yes
                  plugin_people_types: followers, contributors, members

                  plugin_activity: yes
                  plugin_activity_limit: 5
                  plugin_activity_days: 0
                  plugin_activity_filter: issue, pr, release, fork, review, ref/create
